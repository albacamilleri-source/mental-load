<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Send to Mental Load</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="eyebrow">Meal Planner</div>
      <h1>Send to Mental Load<span>.</span></h1>
      <section class="page" aria-label="Current recipe page">
        <div id="page-title" class="title">Reading this page…</div>
        <div id="page-url" class="url"></div>
      </section>
      <fieldset class="planner-picker">
        <legend>Send to</legend>
        <div class="planner-options">
          <label><input type="radio" name="meal-type" value="breakfast"><span>Breakfast</span></label>
          <label><input type="radio" name="meal-type" value="lunch"><span>Lunch</span></label>
          <label><input type="radio" name="meal-type" value="dinner" checked><span>Dinner</span></label>
        </div>
        <div id="planner-help" class="help">Choose whether this recipe belongs in your Breakfast, Lunch or Dinner library.</div>
      </fieldset>
      <div id="initial-actions" class="actions">
        <button id="import-queue" type="button">Import &amp; queue</button>
        <button id="import-only" class="secondary" type="button">Import only</button>
      </div>
      <section id="tag-review" class="review" hidden aria-label="Review recipe tags">
        <div id="review-title" class="review-title"></div>
        <label for="recipe-tags">Edit tags before saving</label>
        <input id="recipe-tags" type="text" autocomplete="off" placeholder="e.g. chicken, quick, pasta" aria-describedby="tag-help">
        <div id="tag-help" class="help">Separate tags with commas. These remain editable in your Recipe library.</div>
        <div class="actions">
          <button id="confirm-import" type="button">Save recipe</button>
          <button id="cancel-review" class="secondary" type="button">Cancel</button>
        </div>
      </section>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
